<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <!-- Background -->
  <rect width="108" height="108" rx="24" fill="#F50D46"/>

  <!-- Cherry Leaf on Note Beam -->
  <path d="M56 26 C52 17, 63 14, 67 21 C65 26, 60 27, 56 26 Z" fill="#FFFFFF"/>

  <!-- Music Note Stems & Beam -->
  <path d="M44 64 V32 L72 27 V59" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M44 39 L72 34" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" fill="none"/>

  <!-- Twin Cherry Note Heads -->
  <circle cx="37" cy="65" r="11" fill="#FFFFFF"/>
  <circle cx="65" cy="60" r="11" fill="#FFFFFF"/>

  <!-- Play Triangle Cutout in Left Cherry -->
  <polygon points="34,60 34,70 42,65" fill="#F50D46"/>
  <!-- Play Triangle Cutout in Right Cherry -->
  <polygon points="62,55 62,65 70,60" fill="#F50D46"/>
</svg>
